name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Minify HTML/CSS/JS
        run: |
          npx --yes esbuild public/assets/site.css public/assets/fonts.css public/assets/site.js --minify --outdir=public/assets --allow-overwrite
          npx --yes html-minifier-terser --input-dir public --output-dir public --file-ext html \
            --collapse-whitespace --remove-comments --minify-css true --minify-js true --continue-on-parse-error

      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
